name: knowledge-copilot

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_LOCAL_MODELS: ${INSTALL_LOCAL_MODELS:-true}
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/storage
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
    volumes:
      # SQLite metadata, ChromaDB vectors, uploaded files, model cache and reports
      - copilot_data:/app/storage
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  copilot_data:
