server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads up to the backend limit (MAX_UPLOAD_SIZE_MB) plus multipart overhead.
    client_max_body_size 110m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;   # evaluation runs and slow LLMs
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    location /docs { proxy_pass http://backend:8000/docs; }
    location = /openapi.json { proxy_pass http://backend:8000/openapi.json; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths return index.html so client-side routes work on reload.
    location / {
        try_files $uri /index.html;
    }
}
